services:

  nginx:
    image: nginx:1.27-alpine
    container_name: pharma-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./Docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - pharma-network

  php:
    build:
      context: ..
      dockerfile: Docker/php/Dockerfile
    container_name: pharma-php
    restart: unless-stopped
    volumes:
      - ./:/var/www
    command: sh -c "chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache && chmod -R 775 /var/www/storage /var/www/bootstrap/cache && php-fpm"
    depends_on:
      - postgres
      - mongodb
      - redis
    networks:
      - pharma-network

  horizon:
    build:
      context: ..
      dockerfile: Docker/horizon/Dockerfile
    container_name: pharma-horizon
    restart: unless-stopped
    volumes:
      - ./:/var/www
    command: sh -c "chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache && chmod -R 775 /var/www/storage /var/www/bootstrap/cache && php artisan horizon"
    depends_on:
      - php
      - redis
    networks:
      - pharma-network

  postgres:
    image: postgres:17
    container_name: pharma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-pharma_control}
      POSTGRES_USER: ${DB_USERNAME:-pharma}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5433:5432"
    volumes:
      - pharma-postgres-data:/var/lib/postgresql/data
    networks:
      - pharma-network

  mongodb:
    image: mongo:8
    container_name: pharma-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-pharma}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-secret}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-pharma_control}
    ports:
      - "27018:27017"
    volumes:
      - pharma-mongodb-data:/data/db
    networks:
      - pharma-network

  redis:
    image: redis:7-alpine
    container_name: pharma-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - pharma-redis-data:/data
    networks:
      - pharma-network

  redis-ui:
    image: rediscommander/redis-commander:latest
    container_name: pharma-redis-ui
    restart: unless-stopped
    environment:
      REDIS_HOSTS: "local:pharma-redis:6379"
    ports:
      - "8082:8081"
    depends_on:
      - redis
    networks:
      - pharma-network

networks:
  pharma-network:
    driver: bridge

volumes:
  pharma-postgres-data:
  pharma-mongodb-data:
  pharma-redis-data:
