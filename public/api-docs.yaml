components:
  schemas:
    IngredientResponse:
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Amoxicilina
        dci_code:
          type: string
          example: amoxicillin
        cas_number:
          type: string
          example: 26787-78-0
          nullable: true
        description:
          type: string
          nullable: true
        is_active:
          type: boolean
          example: true
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      type: object
    CategoryResponse:
      properties:
        id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          example: Analgésicos
        slug:
          type: string
          example: analgesicos
        description:
          type: string
          nullable: true
        is_active:
          type: boolean
          example: true
        is_root:
          type: boolean
          example: false
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      type: object
    CategoryTreeResponse:
      allOf:
        -
          $ref: '#/components/schemas/CategoryResponse'
        -
          properties:
            children:
              type: array
              items:
                $ref: '#/components/schemas/CategoryTreeResponse'
          type: object
    ClassificationResponse:
      properties:
        id:
          type: string
          format: uuid
        lgs_group:
          type: string
          example: II
          enum:
            - I
            - II
            - III
            - IV_A
            - IV_B
            - V
            - VI
        lgs_group_label:
          type: string
          example: 'Grupo II — Psicotrópicos'
        name:
          type: string
          example: 'Psicotrópicos — Grupo II'
        prescription_type:
          type: string
          example: NORMAL
          enum:
            - CON_CODIGO_BARRAS
            - NORMAL
            - SIN_RECETA
        prescription_type_label:
          type: string
          example: 'Receta normal'
        validity_days:
          type: integer
          example: 30
          nullable: true
        validity_note:
          type: string
          example: 'Máximo 2 presentaciones por receta.'
          nullable: true
        is_controlled:
          type: boolean
          example: true
        is_active:
          type: boolean
          example: true
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      type: object
    LaboratoryResponse:
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Pfizer
        country_code:
          type: string
          example: US
        website:
          type: string
          example: 'https://www.pfizer.com'
          nullable: true
        is_active:
          type: boolean
          example: true
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      type: object
    LocationResponse:
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: 'Pos 1'
        level:
          description: '1=Zona, 2=Pasillo, 3=Estante, 4=Posición'
          type: integer
          example: 4
        level_label:
          type: string
          example: Posición
        parent_id:
          type: string
          format: uuid
          nullable: true
        description:
          type: string
          nullable: true
        is_active:
          type: boolean
          example: true
        is_leaf:
          type: boolean
          example: true
        full_path:
          type: string
          example: 'OTC General > Pasillo 1 > Estante 1 > Pos 1'
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      type: object
    PresentationResponse:
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Tableta
        abbreviation:
          type: string
          example: Tab
        description:
          type: string
          example: 'Forma sólida oral.'
          nullable: true
        is_active:
          type: boolean
          example: true
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      type: object
    RouteResponse:
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Oral
        code:
          type: string
          example: VO
        description:
          type: string
          example: 'Administración por la boca.'
          nullable: true
        is_active:
          type: boolean
          example: true
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      type: object
    StatusResponse:
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Activo
        code:
          type: string
          example: ACTIVO
        description:
          type: string
          example: 'El producto está disponible para venta.'
          nullable: true
        is_active:
          type: boolean
          example: true
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      type: object
    UnitResponse:
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Miligramo
        symbol:
          type: string
          example: mg
        type:
          type: string
          example: CONCENTRATION
          enum:
            - QUANTITY
            - CONCENTRATION
        type_label:
          type: string
          example: 'Concentración / Dosis'
        is_active:
          type: boolean
          example: true
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      type: object
    PaginationMeta:
      properties:
        total:
          type: integer
          example: 20
        per_page:
          type: integer
          example: 20
        current_page:
          type: integer
          example: 1
        last_page:
          type: integer
          example: 1
      type: object
    ErrorResponse:
      properties:
        message:
          type: string
          example: 'Recurso no encontrado.'
        error:
          type: string
          example: NOT_FOUND
          nullable: true
      type: object
    ValidationErrorResponse:
      properties:
        message:
          type: string
          example: 'The name field is required.'
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      type: object
    AddressResponse:
      properties:
        street:
          type: string
          example: 'Av. Reforma'
        ext_number:
          type: string
          example: '123'
        int_number:
          type: string
          example: A
          nullable: true
        neighborhood:
          type: string
          example: Centro
        municipality:
          type: string
          example: Puebla
        state:
          type: string
          example: Puebla
        postal_code:
          type: string
          example: '72000'
        country:
          type: string
          example: MX
        full_address:
          type: string
          example: 'Av. Reforma 123, Centro, Puebla, Puebla, CP 72000, MX'
      type: object
    SupplierResponse:
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          example: MORAL
          enum:
            - MORAL
            - FISICA
        type_label:
          type: string
          example: 'Persona Moral'
        rfc:
          type: string
          example: ABC123456XYZ
          nullable: true
        legal_name:
          type: string
          example: 'Distribuidora Farmacéutica del Centro S.A. de C.V.'
        trade_name:
          type: string
          example: DFC
          nullable: true
        address:
          $ref: '#/components/schemas/AddressResponse'
        phone:
          type: string
          example: '2221234567'
          nullable: true
        email:
          type: string
          example: contacto@dfc.mx
          nullable: true
        is_active:
          type: boolean
          example: true
        created_by:
          type: string
          format: uuid
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      type: object
    AddressRequest:
      required:
        - street
        - ext_number
        - neighborhood
        - municipality
        - state
        - postal_code
      properties:
        street:
          type: string
          example: 'Av. Reforma'
          maxLength: 150
        ext_number:
          type: string
          example: '123'
          maxLength: 20
        int_number:
          type: string
          example: A
          nullable: true
          maxLength: 20
        neighborhood:
          type: string
          example: Centro
          maxLength: 100
        municipality:
          type: string
          example: Puebla
          maxLength: 100
        state:
          type: string
          example: Puebla
        postal_code:
          type: string
          pattern: '^[0-9]{5}$'
          example: '72000'
        country:
          type: string
          example: MX
          maxLength: 2
      type: object
  responses:
    Unauthorized:
      description: 'Token ausente, inválido o expirado'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Unauthenticated.
    Forbidden:
      description: 'Sin el permiso requerido'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 'Recurso no encontrado'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: 'Error de validación'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    NoContent:
      description: 'Operación exitosa sin contenido'
  securitySchemes:
    bearerAuth:
      type: http
      bearerFormat: JWT
      scheme: bearer
tags:
  -
    name: 'Catalog · Active Ingredients'
