      operationId: 185af0373794b1967ba94bcbec6ffc72
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - type
                - legal_name
                - address
              properties:
                type:
                  type: string
                  example: MORAL
                  enum: [MORAL, FISICA]
                rfc:
                  type: string
                  example: ABC123456XYZ
                  nullable: true
                legal_name:
                  type: string
                  maxLength: 200
                trade_name:
                  type: string
                  nullable: true
                  maxLength: 150
                address:
                  $ref: '#/components/schemas/AddressRequest'
                phone:
                  type: string
                  example: '2221234567'
