  -
    name: 'Catalog · Classifications'
    description: 'Grupos de medicamentos Art. 226 LGS — fijos por ley'
  -
    name: 'Catalog · Laboratories'
    description: 'Catálogo de laboratorios fabricantes'
  -
    name: 'Catalog · Locations'
    description: 'Ubicaciones físicas de productos en la farmacia (Zona > Pasillo > Estante > Posición)'
  -
