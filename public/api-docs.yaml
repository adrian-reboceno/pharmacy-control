    get:
      tags:
        - Suppliers
      summary: 'Listar proveedores'
      description: 'Lista paginada con filtros opcionales por nombre, RFC, tipo y estado.'
      operationId: c6db27bf0fcb9b36b9fa522087227b6a
      parameters:
        -
          name: search
          in: query
