openapi: 3.0.0
info:
  title: 'PharmaControl API'
  description: "ERP para farmacias multi-sucursal en México con regulación COFEPRIS.\nAutenticación JWT propio (HS256). Todos los endpoints protegidos requieren Authorization: Bearer <token>."
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8080/api/v1/'
    description: 'Local Docker'
paths:
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: 'Iniciar sesión'
      description: 'Autentica al usuario y devuelve par de tokens JWT. Si el usuario tiene múltiples roles, requires_role_selection será true.'
      operationId: d00f4d12443a970455f396756440af3f
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - email
                - password
                - client_type
              properties:
                email:
                  type: string
                  format: email
                  example: admin@pharmaco.mx
                password:
                  type: string
                  format: password
                  example: 'Ch4ng3M3_N0w!#2026'
                client_type:
                  type: string
                  example: WEB
                  enum: [WEB, MOBILE]
              type: object
      responses:
        '200':
          description: 'Login exitoso'
          content:
            application/json:
              schema:
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }
                  expires_in: { type: integer, example: 900 }
                  requires_role_selection: { type: boolean, example: false }
                  requires_password_change: { type: boolean, example: false }
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '423':
          description: 'Cuenta bloqueada'
          content:
            application/json:
              schema:
                properties:
                  message: { type: string, example: 'Cuenta bloqueada.' }
                  error: { type: string, example: ACCOUNT_LOCKED }
                type: object
      security: []
components:
  schemas:
    PaginationMeta:
      properties:
        total:
          type: integer
          example: 20
        per_page:
          type: integer
          example: 20
        current_page:
          type: integer
          example: 1
        last_page:
          type: integer
          example: 1
      type: object
    ErrorResponse:
      properties:
        message:
          type: string
          example: 'Recurso no encontrado.'
        error:
          type: string
          example: NOT_FOUND
          nullable: true
      type: object
    ValidationErrorResponse:
      properties:
        message:
          type: string
          example: 'The name field is required.'
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      type: object
  responses:
    Unauthorized:
      description: 'Token ausente, inválido o expirado'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Unauthenticated.
    Forbidden:
      description: 'Sin el permiso requerido'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 'Recurso no encontrado'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: 'Error de validación'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    NoContent:
      description: 'Operación exitosa sin contenido'
  securitySchemes:
    bearerAuth:
      type: http
      bearerFormat: JWT
      scheme: bearer
tags:
  -
    name: Auth
    description: Auth
